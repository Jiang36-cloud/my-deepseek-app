
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的DeepSeek</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: auto; padding: 16px; background: #f5f5f5; }
        #chatbox { background: white; border-radius: 12px; padding: 16px; min-height: 400px; margin-bottom: 12px; overflow-y: auto; max-height: 600px; }
        .user-msg { text-align: right; color: #007aff; margin: 8px 0; }
        .ai-msg { text-align: left; color: #333; margin: 8px 0; }
        #input-area { display: flex; gap: 8px; }
        #userInput { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; }
        #sendBtn { padding: 12px 20px; background: #007aff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; }
        .loading { opacity: 0.6; color: #888; }
        .api-key-warning { color: red; font-size: 14px; margin-bottom: 12px; background: #ffe0e0; padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>🤖 DeepSeek 助手</h2>
    <div id="chatbox"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="输入你的问题..." />
        <button id="sendBtn">发送</button>
    </div>

    <script>
        // ⚠️ 重要：把你的 DeepSeek API Key 填到下面的引号里
        const API_KEY = 'sk-e6385ea8871b4df6926c51e81cd883d0'; // 替换成你的真实 Key
        const API_URL = 'https://api.deepseek.com/chat/completions';

        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let messages = [{ role: 'system', content: 'You are a helpful assistant.' }];

        function addMessage(content, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' ? 'user-msg' : 'ai-msg';
            msgDiv.textContent = content;
            chatbox.appendChild(msgDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function callDeepSeek(userMessage) {
            messages.push({ role: 'user', content: userMessage });
            addMessage(userMessage, 'user');

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ai-msg loading';
            loadingDiv.textContent = '思考中...';
            chatbox.appendChild(loadingDiv);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: messages,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API 请求失败');
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                loadingDiv.remove();
                addMessage(aiReply, 'ai');
                messages.push({ role: 'assistant', content: aiReply });

            } catch (error) {
                loadingDiv.textContent = `❌ 错误: ${error.message}`;
                loadingDiv.className = 'ai-msg';
                console.error('API 调用失败:', error);
            }
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                userInput.value = '';
                callDeepSeek(text);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
